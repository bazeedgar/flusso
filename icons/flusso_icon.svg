  <!-- Wave 2 (strong, front) -->
  <path d="M0 690 Q110 560 256 620 Q410 700 512 560 Q614 420 768 540 Q900 640 1024 560 L1024 900 Q900 850 768 810 Q614 760 512 860 Q410 930 256 890 Q110 850 0 800 Z"
