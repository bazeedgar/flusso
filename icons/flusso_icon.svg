  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#0F2D23"/>

  <!-- Wave 1 (light, back) -->
  <path d="M0 600 Q110 440 256 530 Q410 630 512 490 Q614 350 768 440 Q900 520 1024 420 L1024 900 Q900 820 768 740 Q614 650 512 780 Q410 880 256 820 Q110 760 0 700 Z"
